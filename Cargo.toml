[package]
name = "summon"
version = "0.1.0"
edition = "2024"
description = "macOS app/window summoner — bind a hotkey to an app, press to summon"
license = "MIT"

[lib]
name = "summon"
path = "src/lib.rs"

[[bin]]
name = "summon"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
anyhow = "1"
thiserror = "1"
directories = "5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
global-hotkey = "0.6"
ratatui = "0.29"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["signal", "process"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"
objc2-foundation = { version = "0.2", features = ["NSString", "NSURL", "NSArray", "NSRunLoop", "NSNotification", "NSThread"] }
objc2-app-kit = { version = "0.2", features = ["NSWorkspace", "NSRunningApplication", "NSApplication", "NSResponder", "libc"] }
libc = "0.2"
accessibility-sys = "0.1"
core-foundation = "0.10"
core-foundation-sys = "0.8"
core-graphics = "0.24"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_System_Threading",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Memory",
  "Win32_System_LibraryLoader",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Shell",
  "Win32_Graphics_Gdi",
  "Win32_UI_HiDpi",
  "Win32_System_Console",
  "Win32_Storage_FileSystem",
] }

[dev-dependencies]
tempfile = "3"
